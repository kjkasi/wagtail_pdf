feature_name: "Каталог PDF-документов со встроенными аннотациями"
problem_statement: >-
  Нужен публичный прототип сайта на Wagtail, в котором редактор загружает PDF-документы,
  а посетитель читает их через почти полноэкранный PDF.js-просмотрщик с навигацией,
  масштабированием и аннотациями из самого PDF.
constraints:
  - "Использовать актуальную поддерживаемую LTS-ветку Wagtail на момент начала реализации."
  - "Зафиксировать совместимые patch-версии Wagtail, Django, Python и PDF.js."
  - "PDF.js, worker, CSS и изображения должны обслуживаться локально без внешнего CDN."
  - "Публичный просмотр должен работать с другого компьютера в локальной сети."
  - "JavaScript-действия из PDF не выполняются, внешние ссылки открываются безопасно."
  - "Каталог и просмотр документов доступны публично без авторизации."
out_of_scope:
  - "Редакторские и пользовательские комментарии."
  - "Создание или изменение PDF-аннотаций в Wagtail."
  - "Авторизация и разграничение доступа."
  - "Поиск по PDF, миниатюры, печать и скачивание из интерфейса просмотрщика."
  - "Сохранение заполненных PDF-форм и свободное рисование."
key_decisions:
  - decision: "Использовать каталог с отдельной страницей просмотра для каждого PDF."
    rationale: "Пользователь должен выбирать один из нескольких опубликованных документов."
  - decision: "Удалить PageComment и брать аннотации только из PDF."
    rationale: "PDF остаётся единственным источником заметок, ссылок и выделений."
  - decision: "Хранить страницу и масштаб как единое состояние просмотрщика."
    rationale: "Canvas, annotation layer, индикатор и кнопки обновляются согласованно."
  - decision: "Использовать масштаб 50–300% с шагом 25% и режимом по ширине."
    rationale: "Этого достаточно для прототипа без полной панели стандартного viewer PDF.js."
  - decision: "Рендерить canvas и annotation layer вне DOM и заменять их только для актуального запроса."
    rationale: "Быстрые переходы, zoom и resize не должны смешивать результаты разных страниц."
