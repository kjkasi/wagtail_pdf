feature_name: "Каталог PDF-документов с постраничными комментариями"
problem_statement: >-
  Нужен публичный прототип сайта на Wagtail, в котором редактор загружает PDF-документы,
  добавляет по одному форматированному комментарию для каждой страницы, а посетитель
  просматривает документ через PDF.js и видит комментарий, синхронизированный с текущей страницей.
constraints:
  - "Использовать актуальную поддерживаемую LTS-ветку Wagtail на момент начала реализации."
  - "Зафиксировать совместимые patch-версии Wagtail, Django и Python в зависимостях проекта."
  - "PDF-просмотрщик должен использовать PDF.js."
  - "Интерфейс просмотра минимальный: PDF, комментарий и кнопки предыдущей/следующей страницы."
  - "Каталог и просмотр документов доступны публично без авторизации."
out_of_scope:
  - "Комментарии посетителей."
  - "Авторизация и разграничение доступа."
  - "Поиск по PDF, миниатюры, печать и скачивание из интерфейса просмотрщика."
  - "Совместное редактирование и версии комментариев сверх стандартных возможностей Wagtail."
key_decisions:
  - decision: "Использовать каталог документов с отдельной страницей просмотра для каждого PDF."
    rationale: "Пользователь должен выбирать один из нескольких опубликованных документов."
  - decision: "Хранить один форматированный редакторский комментарий на одну страницу PDF."
    rationale: "Это соответствует требуемому простому сценарию прототипа."
  - decision: "Переключать страницу PDF и комментарий единым состоянием текущей страницы."
    rationale: "Это исключает рассинхронизацию между документом и пояснением."
  - decision: "Навигация состоит из кнопок «Предыдущая страница» и «Следующая страница»."
    rationale: "Расширенные элементы управления PDF.js не требуются для прототипа."
